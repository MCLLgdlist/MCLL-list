<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MCLL - Official GD List</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Caveat:wght@700&family=Pusab&family=Sedgwick+Ave+Display&family=Permanent+Marker&display=swap" rel="stylesheet">
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Caveat:wght@700&display=swap');

    :root {
      --bg-dark: #070e08;
      --card-bg: #111b13;
      --text-primary: #e0e0e0;
      --text-secondary: #8fa391;
      --accent-cyan: #8ebf8a;
      --border-color: #1e2e21;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: var(--bg-dark);
      background-image: radial-gradient(#152418 1px, transparent 1px);
      background-size: 24px 24px;
      color: var(--text-primary);
      font-family: 'Caveat', cursive, sans-serif;
      font-size: 20px;
      min-height: 100vh;
      padding-bottom: 40px;
    }

    header {
      padding: 20px;
      display: flex;
      justify-content: flex-end;
      align-items: center;
      gap: 12px;
      max-width: 800px;
      margin: 0 auto;
    }

    .discord-btn {
      background-color: #5865F2;
      width: 42px;
      height: 42px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      text-decoration: none;
      box-shadow: 0 4px 10px rgba(0,0,0,0.3);
    }

    .discord-btn svg {
      width: 24px;
      height: 24px;
      fill: #fff;
    }

    .theme-btn {
      background: #152217;
      border: 1px solid var(--border-color);
      color: var(--text-primary);
      padding: 8px 16px;
      border-radius: 20px;
      cursor: pointer;
      font-family: inherit;
      font-size: 18px;
    }

    .hero-title {
      text-align: center;
      margin-top: 10px;
      margin-bottom: 5px;
    }

    .hero-title h1 {
      font-size: 64px;
      color: #dfc28c;
      letter-spacing: 2px;
      font-weight: 700;
      line-height: 1;
    }

    .hero-title p {
      font-size: 18px;
      color: var(--text-secondary);
      letter-spacing: 3px;
      margin-top: 5px;
      text-transform: uppercase;
    }

    .stats-summary {
      text-align: center;
      margin: 20px auto;
    }

    .stats-pill {
      display: inline-block;
      background: #121e14;
      border: 1px solid var(--border-color);
      padding: 6px 20px;
      border-radius: 20px;
      font-size: 18px;
      color: var(--text-secondary);
    }

    .stats-pill span {
      color: var(--text-primary);
    }

    .container {
      max-width: 650px;
      margin: 0 auto;
      padding: 0 15px;
    }

    .nav-grid {
      background: #101a12;
      border: 1px solid var(--border-color);
      border-radius: 16px;
      padding: 12px;
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
      margin-bottom: 25px;
    }

    .tab-btn {
      background: transparent;
      border: none;
      color: var(--text-secondary);
      padding: 12px;
      font-size: 22px;
      cursor: pointer;
      border-radius: 10px;
      font-family: inherit;
      text-align: center;
    }

    .tab-btn.active {
      background-color: #83b07d;
      color: #0d170e;
      font-weight: bold;
    }

    .sub-tabs {
      display: flex;
      justify-content: center;
      gap: 15px;
      margin-bottom: 20px;
    }

    .sub-btn {
      background: #111c13;
      border: 1px solid var(--border-color);
      color: var(--text-secondary);
      padding: 6px 20px;
      border-radius: 20px;
      font-size: 18px;
      cursor: pointer;
      font-family: inherit;
    }

    .sub-btn.active {
      border-color: #83b07d;
      color: #83b07d;
    }

    .search-box {
      margin-bottom: 25px;
    }

    .search-box input {
      width: 100%;
      background: #0e1710;
      border: 1px solid var(--border-color);
      padding: 12px 20px;
      border-radius: 12px;
      color: var(--text-primary);
      font-family: inherit;
      font-size: 20px;
    }

    .card {
      background: #111c13;
      border: 1px solid var(--border-color);
      border-radius: 12px;
      padding: 15px;
      margin-bottom: 12px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      cursor: pointer;
    }

    .no-levels {
      text-align: center;
      color: var(--text-secondary);
      margin: 40px 0;
      font-size: 22px;
    }

    .footer-text {
      text-align: center;
      color: var(--text-secondary);
      font-size: 16px;
      margin-top: 50px;
    }

    .view-panel {
      display: none;
      background: #111c13;
      border: 1px solid var(--border-color);
      border-radius: 16px;
      padding: 20px;
    }

    .btn-back {
      background: transparent;
      border: 1px solid var(--border-color);
      color: #83b07d;
      padding: 6px 16px;
      border-radius: 8px;
      cursor: pointer;
      font-family: inherit;
      font-size: 18px;
      margin-bottom: 15px;
    }
  </style>
</head>
<body>

  <header>
    <a href="https://discord.gg" target="_blank" class="discord-btn">
      <svg viewBox="0 0 127.14 96.36">
        <path d="M107.7,8.07A105.15,105.15,0,0,0,81.47,0a72.06,72.06,0,0,0, -3.36,6.83A97.68,97.68,0,0,0,49,6.83,72.37,72.37,0,0,0,45.64,0,105.89,105.89,0,0,0,19.39,8.09C2.79,32.65-1.71,56.6.54,80.21h0A105.73,105.73,0,0,0,32.71,96.36,77.7,77.7,0,0,0,39.6,85.25a68.42,68.42,0,0,1-10.85-5.18c.91-.66,1.8-1.34,2.66-2a73.57,73.57,0,0,0,64.32,0c.87.69,1.76,1.37,2.66,2a68.68,68.68,0,0,1-10.87,5.19,77,77,0,0,0,6.89,11.1A105.25,105.25,0,0,0,126.6,80.22h0C129.24,52.84,121.66,29,107.7,8.07ZM42.45,65.69C36.18,65.69,31,60,31,53S36,40.31,42.45,40.31C48.92,40.31,54,46,53.87,53,53.87,60,48.92,65.69,42.45,65.69Zm42.24,0C78.41,65.69,73.25,60,73.25,53s5.07-12.69,11.44-12.69C91.13,40.31,96.2,46,96.07,53,96.07,60,91.13,65.69,84.69,65.69Z"/>
      </svg>
    </a>
    <button class="theme-btn">🌙 Theme</button>
  </header>

  <div class="hero-title">
    <h1>MCLL</h1>
    <p>Official GD List</p>
  </div>

  <div class="stats-summary">
    <div class="stats-pill">
      Levels: <span id="stat-levels">0</span> &nbsp;&nbsp; Players: <span id="stat-players">0</span>
    </div>
  </div>

  <div class="container">
    <div class="nav-grid">
      <button class="tab-btn active" onclick="switchMainTab('levels', event)">Levels</button>
      <button class="tab-btn" onclick="switchMainTab('stats', event)">Stats Viewer</button>
      <button class="tab-btn" onclick="switchMainTab('rules', event)">Rules</button>
      <button class="tab-btn" onclick="switchMainTab('roulette', event)">Roulette</button>
    </div>

    <div id="sub-levels-nav" class="sub-tabs">
      <button class="sub-btn active" onclick="switchSubTab('main', event)">Main List</button>
      <button class="sub-btn" onclick="switchSubTab('legacy', event)">Legacy List</button>
    </div>

    <div id="search-controls" class="search-box">
      <input type="text" id="search-input" placeholder="Search..." oninput="filterData()">
    </div>

    <div id="main-content">
      <div id="list-container"></div>
    </div>

    <div id="level-view" class="view-panel">
      <button class="btn-back" onclick="closeView()">← Back</button>
      <h1 id="lvl-title" style="color: #83b07d;"></h1>
      <div id="lvl-details"></div>
    </div>

    <div id="stats-view" style="display: none;">
      <div class="search-box">
        <input type="text" id="stats-search-input" placeholder="Search player..." oninput="renderLeaderboard()">
      </div>
      <div id="stats-result-container"></div>
    </div>

    <div id="player-view" class="view-panel">
      <button class="btn-back" onclick="closeView()">← Back</button>
      <h1 id="pl-name" style="color: #83b07d;"></h1>
      <div id="pl-details"></div>
    </div>

    <div id="rules-view" class="view-panel">
      <h2 style="color: #83b07d; margin-bottom: 10px;">Rules</h2>
      <p style="color: var(--text-secondary);">1. Valid video record required.<br>2. No cheats/hacks allowed.</p>
    </div>

    <div id="roulette-view" style="display: none; text-align: center; padding: 30px 0;">
      <div id="roulette-target-text" style="font-size: 24px; color: var(--text-secondary);">Click "Start" to begin!</div>
      <button id="btn-start" class="sub-btn active" style="margin-top:20px; font-size:22px;" onclick="startRoulette()">Start</button>
    </div>

    <div class="footer-text">
      © 2026 MCLL List. All rights reserved.
    </div>
  </div>
    <script>
    let levelsData = [];
    let playersData = [];
    let currentMainTab = 'levels';
    let currentSubTab = 'main';

    async function loadData() {
      try {
        const res = await fetch('./data.json?r=' + Math.random());
        if (res.ok) {
          const data = await res.json();
          levelsData = data.levels || [];
          playersData = data.players || [];
        }
      } catch (e) {
        console.error(e);
      } finally {
        init();
      }
    }

    function init() {
      document.getElementById('stat-levels').innerText = levelsData.length;
      document.getElementById('stat-players').innerText = playersData.length;
      filterData();
    }

    function switchMainTab(tab, ev) {
      currentMainTab = tab;
      document.querySelectorAll('.nav-grid .tab-btn').forEach(b => b.classList.remove('active'));
      if (ev && ev.target) ev.target.classList.add('active');

      document.getElementById('main-content').style.display = 'none';
      document.getElementById('sub-levels-nav').style.display = 'none';
      document.getElementById('search-controls').style.display = 'none';
      document.getElementById('rules-view').style.display = 'none';
      document.getElementById('stats-view').style.display = 'none';
      document.getElementById('roulette-view').style.display = 'none';
      document.getElementById('level-view').style.display = 'none';
      document.getElementById('player-view').style.display = 'none';

      if (tab === 'levels') {
        document.getElementById('sub-levels-nav').style.display = 'flex';
        document.getElementById('main-content').style.display = 'block';
        document.getElementById('search-controls').style.display = 'block';
        filterData();
      } else if (tab === 'stats') {
        document.getElementById('stats-view').style.display = 'block';
        renderLeaderboard();
      } else if (tab === 'rules') {
        document.getElementById('rules-view').style.display = 'block';
      } else if (tab === 'roulette') {
        document.getElementById('roulette-view').style.display = 'block';
      }
    }

    function switchSubTab(subTab, ev) {
      currentSubTab = subTab;
      document.querySelectorAll('.sub-tabs .sub-btn').forEach(b => b.classList.remove('active'));
      if (ev && ev.target) ev.target.classList.add('active');
      filterData();
    }

    function renderLevels(list) {
      const container = document.getElementById('list-container');
      container.innerHTML = '';
      if (list.length === 0) {
        container.innerHTML = `<div class="no-levels">No levels on ${currentSubTab === 'main' ? 'Main List' : 'Legacy List'} yet.</div>`;
        return;
      }
      list.forEach((lvl, index) => {
        const card = document.createElement('div');
        card.className = 'card';
        card.onclick = () => openLevelView(lvl.id);
        card.innerHTML = `
          <div>
            <div style="font-size: 22px; color: var(--text-primary);">#${index + 1} - ${lvl.title}</div>
            <div style="font-size: 16px; color: var(--text-secondary);">by ${lvl.creator || 'Unknown'}</div>
          </div>
        `;
        container.appendChild(card);
      });
    }

    function openLevelView(id) {
      const lvl = levelsData.find(l => l.id === id);
      if (!lvl) return;

      document.getElementById('main-content').style.display = 'none';
      document.getElementById('sub-levels-nav').style.display = 'none';
      document.getElementById('search-controls').style.display = 'none';
      document.getElementById('level-view').style.display = 'block';

      document.getElementById('lvl-title').innerText = lvl.title;
      document.getElementById('lvl-details').innerHTML = `
        <p><strong>Creator:</strong> ${lvl.creator || 'N/A'}</p>
        <p><strong>Verifier:</strong> ${lvl.verifier || 'N/A'}</p>
      `;
    }

    function renderLeaderboard() {
      const container = document.getElementById('stats-result-container');
      if (playersData.length === 0) {
        container.innerHTML = '<div class="no-levels">No players found.</div>';
        return;
      }
      container.innerHTML = playersData.map((p, i) => `
        <div class="card">
          <div>#${i + 1} - ${p.name}</div>
        </div>
      `).join('');
    }

    function filterData() {
      const query = document.getElementById('search-input').value.toLowerCase().trim();
      const filtered = levelsData.filter(lvl => 
        (lvl.type === currentSubTab || (!lvl.type && currentSubTab === 'main')) &&
        (!query || (lvl.title && lvl.title.toLowerCase().includes(query)))
      );
      renderLevels(filtered);
    }

    function closeView() {
      document.getElementById('level-view').style.display = 'none';
      document.getElementById('player-view').style.display = 'none';
      document.getElementById('main-content').style.display = 'block';
      document.getElementById('sub-levels-nav').style.display = 'flex';
      document.getElementById('search-controls').style.display = 'block';
    }

    document.addEventListener('DOMContentLoaded', loadData);
  </script>
</body>
</html>
